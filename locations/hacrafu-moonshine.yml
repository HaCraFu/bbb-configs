# Wireless profile
location__wireless_profiles__to_merge:
  - name: moonshine
    ifaces:
      - mode: ap
        ssid: moonshine-test
        encryption: none
        network: dhcp
        radio: [11a_standard, 11g_standard]
        ifname_hint: moon_t

      - mode: ap
        ssid: moonshine-prod
        encryption: psk-mixed
        key: "file:/root/moon_pass"
        network: dhcp
        radio: [11a_standard, 11g_standard]
        ifname_hint: moon_p

  - name: moonshine_mesh
    ifaces:
      - mode: ap
        ssid: moonshine-test
        encryption: none
        network: dhcp
        radio: [11a_standard, 11g_standard]
        ifname_hint: moon_t

      - mode: ap
        ssid: moonshine-prod
        encryption: psk-mixed
        key: "file:/root/moon_pass"
        network: dhcp
        radio: [11a_standard, 11g_standard]
        ifname_hint: moon_p

      - mode: mesh
        mesh_id: Mesh-Freifunk-Berlin
        radio: [11a_standard, 11g_standard, 11a_mesh]
        mcast_rate: 12000
        mesh_fwding: 0
        mesh_nolearn: 1
        ifname_hint: mesh
