hosts:
  - hostname: hacrafu-moonshine
    role: corerouter
    model: "genexis_pulse-ex400"
    wireless_profile: moonshine_mesh
    host__rclocal__to_merge:
      - |
        uci set network.vlan_40.ports='lan:u'
        uci set network.vlan_42.ports='lan:t'
        uci set network.vlan_50.ports='wan:u'
        uci commit network; reload_config

  - hostname: hacrafu-moonshine-ap-1 # mind. 3 Ports
    role: ap
    model: "cudy_wr3000-v1"
    wireless_profile: moonshine

  - hostname: hacrafu-moonshine-ap-2
