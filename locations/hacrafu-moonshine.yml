  - hostname: hacrafu-moonshine-ap-6
    role: ap
    model: "cudy_ap3000outdoor-v1"
    wireless_profile: moonshine

ipv6_prefix: "2001:bf7:850:1e00::/56"
# dhcp    10.248.43.0/26
# mesh    10.248.21.64/28
# MGMT    10.248.21.80/29
# TUNNEL  10.31.42.110/31

networks:
  # MESH - 5 GHz 802.11s
  - vid: 20
    role: mesh
    name: mesh_5g
    prefix: 10.248.21.64/32
    ipv6_subprefix: -20
    mesh_ap: hacrafu-moonshine
    mesh_radio: 11a_standard
    mesh_iface: mesh

  # MESH - 2.4 GHz 802.11s
  - vid: 21
    role: mesh
    name: mesh_2g
    prefix: 10.248.21.65/32
    ipv6_subprefix: -21
    mesh_ap: hacrafu-moonshine
    mesh_radio: 11g_standard
    mesh_iface: mesh

  # DHCP
  - vid: 40
    role: dhcp
    # name: prod
    inbound_filtering: false
    enforce_client_isolation: false
    prefix: 10.248.43.0/26
    ipv6_subprefix: 0
    assignments:
      hacrafu-moonshine: 1 # 1
      homeassistant: 2 # 2
      gateway13: 3 # 3
      gateway14: 4 # 4
      gateway15: 5 # 5
      player1: 6
      player2: 7
      player3: 8
      player4: 9
      moontorch1: 11
      moontorch2: 12
      moontorch3: 13
      moontorch4: 14
      moontorch5: 15
      moontorch6: 16
      moontorch7: 17
      moontorch8: 18
      moontorch9: 19
      moontorch10: 20
      moontorch11: 21
      moontorch12: 22

  # DHCP
  # - vid: 41
  #   role: dhcp
  #   name: test
  #   inbound_filtering: false
  #   enforce_client_isolation: false
  #   prefix: ..../28
  #   ipv6_subprefix: 0
  #   assignments:
  #     hacrafu-moonshine: 1

  # MGMT
  - vid: 42
    role: mgmt
    prefix: 10.248.21.80/29
    gateway: 1
    dns: 1
    ipv6_subprefix: 1
    assignments:
      hacrafu-moonshine: 1  # 81
      hacrafu-moonshine-ap-1: 2  # 82
      hacrafu-moonshine-ap-2: 3  # 83
      hacrafu-moonshine-ap-3: 4  # 84
      hacrafu-moonshine-ap-4: 5  # 85
      hacrafu-moonshine-ap-5: 6  # 86
      hacrafu-moonshine-ap-6: 7  # 87

  # Uplink
  - vid: 50
    role: uplink

  - role: tunnel
    ifname: ts_wg0
    mtu: 1280
    prefix: 10.248.77.86/32
    wireguard_port: 51820

  - role: tunnel
    ifname: ts_wg1
    mtu: 1280
    prefix: 10.248.77.87/32
    wireguard_port: 51821

