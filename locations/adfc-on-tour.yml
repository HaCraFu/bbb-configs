    ifaces:
      - mode: ap
        ssid: freifunk adfc-on-tour
        encryption: none
        network: dhcp
        radio: [11g_standard]
        ifname_hint: adfc

      - mode: ap
        ssid: freifunk.hacrafu.de
        encryption: none
        network: dhcp
        radio: [11g_standard]
        ifname_hint: ff
